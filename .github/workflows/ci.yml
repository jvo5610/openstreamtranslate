name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m py_compile app/*.py remote/*.py scripts/*.py docs/diagrams/*.py
      - name: Check JavaScript
        run: |
          node --check app/static/app.js
          node --check app/static/watch.js
          node --check app/static/embed.js
      - name: Check shell scripts
        run: for file in scripts/*.sh remote/*.sh; do bash -n "$file"; done
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate Compose
        run: docker compose config -q
